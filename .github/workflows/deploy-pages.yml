name: Deploy GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for website entry point
        id: site
        run: |
          if test -f docs/index.html; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - name: Configure Pages
        if: steps.site.outputs.exists == 'true'
        uses: actions/configure-pages@v5
      - name: Upload site
        if: steps.site.outputs.exists == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy
        if: steps.site.outputs.exists == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
