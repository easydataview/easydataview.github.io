name: Refresh Apple Store and YouTube Catalog
on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
permissions:
  contents: write
concurrency:
  group: catalog-sync
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch official metadata
        run: python3 scripts/refresh_app_catalog.py
      - name: Commit verified changes
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard docs/apps)" ]; then
            echo "No changes to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/apps.json docs/index.html docs/apps
          git commit -m "Refresh App Store catalog and YouTube previews"
          git push
